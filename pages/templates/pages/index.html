<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #007BFF; padding-bottom: 10px; }
        p { font-size: 16px; line-height: 1.6; }
        strong { color: #007BFF; }
    </style>
</head>
<body>

    <div class="container">
        <h2>My Personal Information</h2>
     
        <p><strong>Full Name:</strong> {{ first_name|capfirst|add:" "|add:last_name }}</p>
        

        <p><strong>Student ID:</strong> {{ student_id|stringformat:"s" }}</p>

        <p><strong>Address:</strong> {{ address|upper }}</p>
        

        <p><strong>Email:</strong> {{ email|default:"No email provided" }}</p>
        

        <p><strong>Time since Birth:</strong> {{ birth_date|timesince }}</p>
    </div>

</body>
</html>
